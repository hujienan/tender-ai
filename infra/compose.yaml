services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17
    environment:
      POSTGRES_DB: tenderai
      POSTGRES_USER: tenderai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tenderai_local}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-54329}:5432"
    volumes:
      - tenderai_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tenderai -d tenderai"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  tenderai_postgres:
